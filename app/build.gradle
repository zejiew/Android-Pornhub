plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phclient.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.phclient.app"
        minSdk 26            // Android 8.0+：WebView 内核足够新，且支持画中画
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // 个人自用：默认用 debug 签名，保证 assembleRelease 出来的包能直接安装。
            // 要换自己的证书：在下面 signingConfigs 里改成你的 storeFile / 密码 / alias。
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 刻意不引入任何第三方依赖：全部使用 Android 系统 SDK。
    // 依赖越少，构建越不容易因为网络/仓库问题失败。
}
