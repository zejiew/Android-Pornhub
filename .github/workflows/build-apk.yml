# ============================================================
#  GitHub Actions：云端构建 APK
#
#  关键说明：
#   ubuntu-latest 现在是 Ubuntu 24.04，镜像里已经预装了 Android SDK：
#     ANDROID_HOME = /usr/local/lib/android/sdk
#     预装 platforms;android-34 与 build-tools;34.0.0（正好是本项目需要的）
#
#   因此这里【不使用】 android-actions/setup-android。
#   该 action 在新镜像上会报 "Could not determine SDK root" 而失败
#   （见 https://github.com/orgs/community/discussions/175078 ），
#   表现为 "Set up Android SDK" 步骤秒失败、后续构建全部被跳过。
# ============================================================
name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 校验预装的 SDK 是否可用；缺什么就补装什么（用 --sdk_root 规避定位问题）
      - name: Verify / install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "使用 SDK: $SDK"
          ls "$SDK" || true

          # 清掉可能残留的本地 properties，避免指向不存在的路径
          rm -f local.properties

          NEED=0
          [ -d "$SDK/platforms/android-34" ] || NEED=1
          [ -d "$SDK/build-tools/34.0.0" ]  || NEED=1

          if [ "$NEED" = "1" ]; then
            echo "缺少组件，开始安装..."
            yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            sdkmanager --sdk_root="$SDK" --install \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "platform-tools"
          else
            echo "预装组件齐全，跳过安装 ✓"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Show produced APK
        if: success()
        run: |
          ls -lh app/build/outputs/apk/release/
          echo "----"
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/outputs/logs/**
          retention-days: 7
          if-no-files-found: ignore
